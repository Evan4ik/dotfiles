# More option see https://github.com/DreamMaoMao/mango/wiki/

env=WLR_RENDERER,vulkan
monitorrule=name:DVI-D-1,width:2560,height:1440,refresh:144,x:1952,y:10,rr:0:hdr:1
monitorrule=name:HDMI-A-1,width:1920,height:1080,refresh:60,x:32,y:192

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 1
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=zoom
animation_type_unminimize=zoom
animation_type_minimize=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=150
animation_duration_open=150
animation_duration_tag=0
animation_duration_close=200
animation_duration_focus=100
animation_duration_minimize=125
animation_duration_unminimize=175
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proprtion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
default_mfact=0.55
default_nmaster=1
smartgaps=1
tag_carousel=1

# Dwindle Layout Setting
#
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
cursor_theme=Adwaita
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=40
repeat_delay=200
numlockon=1
xkb_rules_layout=us,lv,ru,de
xkb_rules_variant=,tilde,,
xkb_rules_options=grp:alt_shift_toggle

# Trackpad
# need relogin to make it apply
#disable_trackpad=0
#tap_to_click=1
#tap_and_drag=1
#drag_lock=1
#trackpad_natural_scrolling=0
#disable_while_typing=1
#left_handed=0
#middle_button_emulation=0
#swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=5
gappov=5
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=3
rootcolor=0x292A2DFF 
bordercolor=0x1A1F1FFF 
dropcolor=0x427282FF 
splitcolor=0x41558FFF 
focuscolor=0x589485FF 
maximizescreencolor=0x427282FF 
urgentcolor=0x41558FFF 
scratchpadcolor=0x286B82FF 
globalcolor=0x609AAEFF 
overlaycolor=0xD0D4E3FF 

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu and terminal
bind=SUPER,D,spawn,rofi -show drun -show-icons
bind=SUPER+Shift,D,spawn,rofi -show calc -modi calc -no-show-match -no-sort -font 'JetBrainsMono 10'
bind=SUPER,Return,spawn,foot

#custom start 
bind=SUPER,E,spawn,thunar
bind=SUPER,W,spawn,librewolf-bin

bind=SUPER+Shift,B,spawn_shell,pkill waybar & sleep 1 && waybar -c ~/.config/mango/waybar/config.jsonc -s ~/.config/mango/waybar/style.css
bind=SUPER+CTRL,B,spawn_shell,~/dox/waybartoggle
bind=SUPER,B,spawn_shell,~/dox/waybartogglemonitor
bind=NONE,PRINT,spawn_shell,wayfreeze --before-freeze-cmd '~/dox/colorpicker; killall wayfreeze'
bind=SUPER,PRINT,spawn_shell,wayfreeze --after-freeze-cmd 'grim -g "$(slurp -w 0)" - | wl-copy; killall wayfreeze'
bind=SUPER+SHIFT,PRINT,spawn_shell,~/dox/screenshotutil
bind=SUPER,DELETE,spawn_shell,~/dox/killProcess

#recording
bind=SUPER+SHIFT,F8,spawn_shell,gpu-screen-recorder -o ~/vids/RegionRecording.mp4 -w "$(slurp -w 0 -f '%wx%h+%x+%y' )" -a default_output -a default_input
bind=SUPER,F8,spawn_shell,gpu-screen-recorder -o ~/vids/MonitorRecording.mp4 -w "$(mmsg get last_open_surface | jq -r .monitor)" -a default_output -a default_input
bind=NONE,F8,spawn_shell,pkill gpu-screen

#audio
bind=SUPER,F3,spawn_shell,pactl set-sink-volume @DEFAULT_SINK@ +5%
bind=SUPER,F2,spawn_shell,pactl set-sink-volume @DEFAULT_SINK@ -5%

# exit
bind=SUPER+shift,x,spawn_shell,loginctl lock-session && sleep 1 && loginctl suspend -i
bind=SUPER+shift,q,quit
bind=SUPER,q,killclient,

# switch window focus
bind=SUPER,Space,zoom
bind=SUPER,l,setmfact,+0.05
bind=SUPER,h,setmfact,-0.05
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev

# swap window
#bind=SUPER+SHIFT,Up,exchange_client,up
#bind=SUPER+SHIFT,Down,exchange_client,down
#bind=SUPER+SHIFT,Left,exchange_client,left
#bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,togglejump,
bind=SUPER,v,togglefloating,
#bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,f,togglemaximizescreen,
bind=SUPER+ctrl,f,togglefakefullscreen,
bind=SUPER+SHIFT,z,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER,i,restore_minimized
bind=SUPER,z,toggle_scratchpad
bind=SUPER,a,toggle_named_scratchpad,mpv,none,/home/evan/dox/dmenuytutils/mpvmusicplayer ~/.config/mpv/playlists/currentplaylist.m3u 
scratchpad_cross_monitor=1

# scroller layout
bind=SUPER,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER+shift,n,spawn_shell,~/.config/mango/layoutselector

# tag switch
#bind=SUPER,Left,viewtoleft,0
#bind=CTRL,Left,viewtoleft_have_client,0
#bind=SUPER,Right,viewtoright,0
#bind=CTRL,Right,viewtoright_have_client,0
#bind=CTRL+SUPER,Left,tagtoleft,0
#bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0 # DVI-D-1
bind=SUPER,2,view,2,0 #DVI-D-1
bind=SUPER,3,view,3,0 #DVI-D-1
bind=SUPER,4,view,4,0 #DVI-D-1
bind=SUPER,5,view,5,0 #DVI-D-1
bind=SUPER,6,view,6,0 #DVI-D-1
bind=SUPER,7,view,7,0 #DVI-D-1
bind=SUPER,8,view,8,0 #DVI-D-1
bind=SUPER,9,view,9,0 #DVI-D-1
bind=SUPER,0,view,0,0

# bind=SUPER+Shift,1,viewcrossmon,1,HDMI-A-1
# bind=SUPER+Shift,2,viewcrossmon,2,HDMI-A-1
# bind=SUPER+Shift,3,viewcrossmon,3,HDMI-A-1
# bind=SUPER+Shift,4,viewcrossmon,4,HDMI-A-1
# bind=SUPER+Shift,5,viewcrossmon,5,HDMI-A-1
# bind=SUPER+Shift,6,viewcrossmon,6,HDMI-A-1
# bind=SUPER+Shift,7,viewcrossmon,7,HDMI-A-1
# bind=SUPER+Shift,8,viewcrossmon,8,HDMI-A-1
# bind=SUPER+Shift,9,viewcrossmon,9,HDMI-A-1

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right

axisbind=SUPER,UP,focusmon,left
axisbind=SUPER,DOWN,focusmon,right

bind=SUPER+SHIFT,comma,tagmon,left
bind=SUPER+SHIFT,period,tagmon,right

axisbind=SUPER+SHIFT,UP,tagmon,left
axisbind=SUPER+SHIFT,DOWN,tagmon,right
# gaps
bind=SUPER,M,incgaps,1
bind=SUPER,N,incgaps,-1
bind=SUPER,R,toggle_render_border
bind=SUPER,A,togglegaps

# movewin
#bind=CTRL+SHIFT,Up,movewin,+0,-50
#bind=CTRL+SHIFT,Down,movewin,+0,+50
#bind=CTRL+SHIFT,Left,movewin,-50,+0
#bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
#axisbind=SUPER,UP,viewtoleft_have_client
#axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

#windowrule=animation_type_open:zoom,animation_type_unminimize:slide,appid:foot
#windowrule=isnoanimation:1,appid:foot
windowrule=isnamedscratchpad:1,width:420,height:420,appid:mpv
windowrule=force_tiled_state:1,vrr_only_fullscreen:1,appid:steam_app_default

exec-once=waybar -c ~/.config/mango/waybar/config.jsonc -s ~/.config/mango/waybar/style.css
exec-once=swaybg -i ~/.local/bg
exec-once=wlsunset -s 21:30 -S 6:30 -t 4750 -T 6500
exec-once=swayidle -w
exec-once=mako
exec-once=/usr/libexec/xdg-desktop-portal-wlr
exec-once=/usr/libexec/xdg-desktop-portal
exec-once=pidof -q pipewire && echo "pipewire" || gentoo-pipewire-launcher restart
exec-once=foot
